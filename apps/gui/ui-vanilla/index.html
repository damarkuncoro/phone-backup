<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Backup Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
    /* Hide native scrollbars for a cleaner look */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">

  <!-- Rails-style Main Layout Wrapper -->
  <pb-app-layout id="app-layout"></pb-app-layout>

  <!-- Global Modals & Notifications (Floating outside layout) -->
  <pb-progress-hud id="global-progress"></pb-progress-hud>
  <pb-settings-modal id="settings-modal"></pb-settings-modal>
  <pb-notification id="notifier"></pb-notification>
  <pb-log-hud id="log-hud"></pb-log-hud>

  <!-- App Bootstrapper -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
