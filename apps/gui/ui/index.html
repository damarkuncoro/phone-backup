<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Backup Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; }
    .glass-card { background: white; border: 1px solid #e2e8f0; }
    #settings-modal { display: none; }
    /* Custom scrollbar for sidebar */
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="w-72 bg-indigo-950 text-white flex flex-col flex-shrink-0 shadow-2xl z-50">
    <div class="p-8 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        </div>
        <span class="text-xl font-black tracking-tighter italic">PB PRO</span>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-8 mt-4">
      <!-- Search inside sidebar -->
      <div class="px-2">
        <label class="text-[10px] font-black text-indigo-400 uppercase tracking-widest ml-2 mb-2 block">Quick Search</label>
        <div class="relative">
          <input type="text" id="global-search" placeholder="Search objects..." class="w-full bg-indigo-900/50 border border-white/10 text-white placeholder-indigo-300/50 px-4 py-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
          <kbd class="absolute right-3 top-3 text-[10px] bg-white/10 px-1.5 py-0.5 rounded text-indigo-300 font-mono">⏎</kbd>
        </div>
      </div>

      <!-- Nav Groups -->
      <nav class="space-y-1">
        <button id="nav-dashboard-btn" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold bg-indigo-500 text-white rounded-xl shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </button>
        <button id="nav-devices-btn" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-indigo-200 hover:bg-white/5 rounded-xl transition-all">
          <svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          Devices
        </button>
        <button id="nav-contacts-btn" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-indigo-200 hover:bg-white/5 rounded-xl transition-all">
          <svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Global Contacts
        </button>
        <button id="settings-btn" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-indigo-200 hover:bg-white/5 rounded-xl transition-all">
          <svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          System Settings
        </button>
      </nav>

      <!-- Testing Area -->
      <div class="pt-8 border-t border-white/5 space-y-3">
        <label class="text-[9px] font-black text-white/30 uppercase tracking-[0.3em] ml-2 block">Developer Tools</label>
        <button onclick="console.log('Inline test'); alert('JavaScript Inline OK')" class="w-full text-left px-4 py-2 text-[10px] font-black text-indigo-300 hover:text-white transition-colors bg-white/5 rounded-lg border border-white/5">RUN INLINE TEST</button>
        <button id="test-js-btn" class="w-full text-left px-4 py-2 text-[10px] font-black text-indigo-300 hover:text-white transition-colors bg-white/5 rounded-lg border border-white/5 uppercase">Run Module Test</button>
      </div>
    </div>

    <div class="p-6 border-t border-white/5 bg-indigo-950">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <div class="flex-1">
          <div class="text-[10px] font-black text-white uppercase tracking-tighter leading-none">Engine Online</div>
          <div class="text-[9px] text-white/40 font-mono mt-1 uppercase tracking-widest">v0.3.1 Stable</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 relative">

    <!-- Dashboard View -->
    <div id="dashboard-view" class="flex-1 overflow-y-auto p-12 custom-scrollbar">
      <div class="max-w-7xl mx-auto space-y-12">

        <header class="flex justify-between items-end">
          <div>
            <h1 class="text-4xl font-black text-slate-800 tracking-tighter">System Health</h1>
            <p class="text-slate-400 font-bold uppercase text-xs mt-2 tracking-widest">Monitoring global deduplication & storage metrics</p>
          </div>
          <button id="refresh-btn" class="bg-white px-6 py-3 rounded-2xl text-xs font-black text-indigo-600 shadow-sm border border-slate-200 hover:border-indigo-300 transition-all uppercase tracking-widest">Rescan Hardware</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <pb-stat id="stat-efficiency" label="Efficiency" value="-" subtext="Calculating..."></pb-stat>
            <pb-stat id="stat-snapshots" label="Snapshots" value="-" subtext="Total backups"></pb-stat>
            <pb-stat id="stat-adb" label="ADB Status" value="Checking" subtext="Wait..."></pb-stat>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
          <section class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden flex flex-col min-h-[400px]">
              <div class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-black text-slate-800 uppercase tracking-widest text-xs flex items-center gap-3">
                  <span class="w-1.5 h-1.5 bg-indigo-600 rounded-full"></span>
                  Active Connections
                </h2>
              </div>
              <div id="device-list" class="flex-1 overflow-y-auto"></div>
          </section>

          <section id="history-section" class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden hidden flex flex-col min-h-[400px]">
              <div class="px-8 py-6 border-b border-slate-50 bg-indigo-50/30">
                <h2 id="history-title" class="font-black text-indigo-600 uppercase tracking-widest text-xs flex items-center gap-3">
                  <span class="w-1.5 h-1.5 bg-indigo-600 rounded-full"></span>
                  History Explorer
                </h2>
              </div>
              <pb-snapshot-list id="history-list" class="flex-1 overflow-y-auto"></pb-snapshot-list>
          </section>
        </div>
      </div>
    </div>

    <!-- Browser View -->
    <div id="browser-view" class="hidden absolute inset-0 bg-slate-50 z-10 p-12 overflow-y-auto">
      <pb-file-browser id="file-browser"></pb-file-browser>
    </div>

    <!-- Contacts Search View -->
    <div id="contacts-view" class="hidden flex-1 overflow-y-auto p-12 custom-scrollbar">
      <div class="max-w-7xl mx-auto space-y-8">
        <header>
          <h1 class="text-4xl font-black text-slate-800 tracking-tighter text-indigo-600">Global Contacts</h1>
          <p class="text-slate-400 font-bold uppercase text-xs mt-2 tracking-widest">Search across all backed up devices and snapshots</p>
        </header>

        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-slate-100">
          <input type="text" id="contact-global-search" placeholder="Enter name, phone, or email..." class="w-full px-8 py-5 bg-slate-50 border-none rounded-3xl text-lg outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all font-bold placeholder-slate-300">
        </div>

        <div id="global-contacts-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </div>

  </main>

  <!-- Global Overlays -->
  <pb-progress-hud id="global-progress"></pb-progress-hud>
  <pb-settings-modal id="settings-modal"></pb-settings-modal>
  <pb-notification id="notifier"></pb-notification>

  <!-- App Core -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
