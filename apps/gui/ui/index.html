<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Backup Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; }
    .glass-card { background: white; border: 1px solid #e2e8f0; }
    #file-modal, #settings-modal { display: none; }
  </style>
</head>
<body>

  <nav class="bg-indigo-700 text-white h-16 flex items-center px-8 justify-between shadow-lg sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <span class="text-xl font-bold tracking-tight">phone-backup</span>
      <input type="text" id="global-search" placeholder="Search files..." class="bg-indigo-800 text-white placeholder-indigo-300 px-4 py-1.5 rounded-md text-sm border-none focus:ring-2 focus:ring-white/50 w-64 outline-none ml-4">
      <!-- Tombol Test JS yang terjamin (Inline) -->
      <button onclick="console.log('Inline test'); alert('JavaScript Inline OK')" class="bg-indigo-500 px-3 py-1 text-xs rounded font-bold">INLINE TEST</button>
      <!-- Tombol Test JS untuk Module -->
      <button id="test-js-btn" class="bg-indigo-500 hover:bg-indigo-400 px-3 py-1 text-xs rounded font-bold transition-colors">MODULE TEST</button>
    </div>
    <div class="flex gap-4">
      <button id="settings-btn" class="p-2 hover:bg-indigo-600 rounded-full transition-colors">⚙️</button>
    </div>
  </nav>

  <main id="dashboard-view" class="container mx-auto px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <pb-stat id="stat-efficiency" label="Efficiency" value="-" subtext="Calculating..."></pb-stat>
        <pb-stat id="stat-snapshots" label="Snapshots" value="-" subtext="Total backups"></pb-stat>
        <pb-stat id="stat-adb" label="ADB Status" value="Checking" subtext="Wait..."></pb-stat>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h2 class="font-bold text-slate-700">Connected Devices</h2>
            <button id="refresh-btn" class="text-indigo-600 text-sm font-bold">RESCAN</button>
          </div>
          <div id="device-list" class="min-h-[200px]"></div>
      </section>

      <section id="history-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
          <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
            <h2 id="history-title" class="font-bold text-indigo-600">History</h2>
          </div>
          <pb-snapshot-list id="history-list"></pb-snapshot-list>
      </section>
    </div>
  </main>

  <!-- Browser View (Replacement for Modal) -->
  <div id="browser-view" class="hidden container mx-auto px-6 py-8">
    <pb-file-browser id="file-browser"></pb-file-browser>
  </div>

  <!-- Components -->
  <pb-progress-hud id="global-progress"></pb-progress-hud>
  <pb-settings-modal id="settings-modal"></pb-settings-modal>
  <pb-notification id="notifier"></pb-notification>

  <!-- PENTING: type="module" dimuat di akhir body -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
