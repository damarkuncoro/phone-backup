[workspace]
resolver = "2"
members = [
    "apps/cli",
    "core/domain",
    "core/application",
    "core/ports",
    "adapters/filesystem",
    "adapters/mock",
    "adapters/adb",
    "adapters/opendal",
    "infrastructure/database-sqlite",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Damar Kuncoro <damarkuncoro@gmail.com>"]
description = "A secure Android backup platform with encryption, deduplication, and scheduling."
repository = "https://github.com/damarkuncoro/phone-backup"
homepage = "https://github.com/damarkuncoro/phone-backup"
readme = "README.md"
keywords = ["android", "backup", "adb", "encryption", "deduplication"]
categories = ["command-line-utilities", "backup"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zstd = "0.13"
mime_guess = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
kamadak-exif = "0.5"
sysinfo = "0.30"
which = "6.0"
indicatif = "0.17"
rayon = "1.10"
opendal = { version = "0.48", features = ["services-s3", "layers-blocking"] }
tempfile = "3"
age = { version = "0.10", features = ["armor"] }
secrecy = "0.8"
fastcdc = "3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
