[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/gui/src-tauri",
    "core/domain",
    "core/application",
    "core/ports",
    "adapters/filesystem",
    "adapters/mock",
    "adapters/adb",
    "adapters/opendal",
    "infrastructure/database-sqlite",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Damar Kuncoro <damarkuncoro@gmail.com>"]
description = "A secure Android backup platform with encryption, deduplication, and scheduling."
repository = "https://github.com/damarkuncoro/phone-backup"
homepage = "https://github.com/damarkuncoro/phone-backup"
readme = "README.md"
keywords = ["android", "backup", "adb", "encryption", "deduplication"]
categories = ["command-line-utilities", "backup"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zstd = "0.13"
mime_guess = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
kamadak-exif = "0.5"
mp4 = "0.14"
sysinfo = "0.30"
which = "6.0"
indicatif = "0.17"
number_prefix = "0.4"
rayon = "1.10"
opendal = { version = "0.48", features = ["services-s3", "layers-blocking"] }
tempfile = "3"
age = { version = "0.10", features = ["armor"] }
secrecy = "0.8"
fastcdc = "3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = "0.7"
socketioxide = { version = "0.15", features = ["v4"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Internal Workspace Dependencies (Short names for convenience)
domain = { path = "core/domain", package = "phone-backup-domain", version = "0.3.1" }
ports = { path = "core/ports", package = "phone-backup-ports", version = "0.3.1" }
application = { path = "core/application", package = "phone-backup-application", version = "0.3.1" }
adapter-mock = { path = "adapters/mock", package = "phone-backup-adapter-mock", version = "0.3.1" }
adapter-adb = { path = "adapters/adb", package = "phone-backup-adapter-adb", version = "0.3.1" }
adapter-filesystem = { path = "adapters/filesystem", package = "phone-backup-adapter-filesystem", version = "0.3.1" }
adapter-opendal = { path = "adapters/opendal", package = "phone-backup-adapter-opendal", version = "0.3.1" }
adapter-database-sqlite = { path = "infrastructure/database-sqlite", package = "phone-backup-adapter-database-sqlite", version = "0.3.1" }
gui = { path = "apps/gui/src-tauri", package = "phone-backup-gui", version = "0.3.1" }
