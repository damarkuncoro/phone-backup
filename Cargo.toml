[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/gui/src-tauri",
    "libs/core/domain",
    "libs/core/application",
    "libs/core/ports",
    "libs/storage/chunking",
    "libs/storage/compression",
    "libs/storage/security",
    "libs/adapters/filesystem",
    "libs/adapters/mock",
    "libs/adapters/adb",
    "libs/adapters/mtp",
    "libs/adapters/agent",
    "libs/adapters/opendal",
    "libs/infrastructure/database-sqlite",
    "libs/data/contacts",
    "libs/media/image",
    "libs/data/messages",
    "libs/data/apps",
    "libs/apps/whatsapp",
    "libs/media/audio",
    "libs/adapters/ios",
    "libs/scanner",
    "libs/data/documents",
    "libs/media/video",
    "libs/data/calls",
    "libs/data/calendar",
    "libs/apps/telegram",
    "libs/data/notes",
    "libs/data/wifi",
    "libs/data/bookmarks",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Damar Kuncoro <damarkuncoro@gmail.com>"]
description = "A secure Android backup platform with encryption, deduplication, and scheduling."
repository = "https://github.com/damarkuncoro/phone-backup"
homepage = "https://github.com/damarkuncoro/phone-backup"
readme = "README.md"
keywords = ["android", "backup", "adb", "encryption", "deduplication"]
categories = ["command-line-utilities", "backup"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
zstd = "0.13"
mime_guess = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
kamadak-exif = "0.5"
mp4 = "0.14"
quick-xml = "0.31"
sysinfo = "0.30"
which = "6.0"
indicatif = "0.17"
number_prefix = "0.4"
rayon = "1.10"
opendal = { version = "0.48", features = ["services-s3", "services-gcs", "services-azblob", "services-webdav", "layers-blocking"] }
tempfile = "3"
age = { version = "0.10", features = ["armor"] }
secrecy = "0.8"
fastcdc = "3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = "0.7"
socketioxide = { version = "0.15", features = ["v4"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Internal Workspace Dependencies (Short names for convenience)
domain = { path = "libs/core/domain", package = "phone-backup-domain", version = "0.5.0" }
ports = { path = "libs/core/ports", package = "phone-backup-ports", version = "0.5.0" }
application = { path = "libs/core/application", package = "phone-backup-application", version = "0.5.0" }
adapter-mock = { path = "libs/adapters/mock", package = "phone-backup-adapter-mock", version = "0.5.0" }
adapter-adb = { path = "libs/adapters/adb", package = "phone-backup-adapter-adb", version = "0.5.0" }
adapter-mtp = { path = "libs/adapters/mtp", package = "phone-backup-adapter-mtp", version = "0.5.0" }
adapter-agent = { path = "libs/adapters/agent", package = "phone-backup-adapter-agent", version = "0.5.0" }
adapter-filesystem = { path = "libs/adapters/filesystem", package = "phone-backup-adapter-filesystem", version = "0.5.0" }
adapter-opendal = { path = "libs/adapters/opendal", package = "phone-backup-adapter-opendal", version = "0.5.0" }
adapter-database-sqlite = { path = "libs/infrastructure/database-sqlite", package = "phone-backup-adapter-database-sqlite", version = "0.5.0" }
chunking = { path = "libs/storage/chunking", package = "phone-backup-chunking", version = "0.5.0" }
compression = { path = "libs/storage/compression", package = "phone-backup-compression", version = "0.5.0" }
security = { path = "libs/storage/security", package = "phone-backup-security", version = "0.5.0" }
contacts = { path = "libs/data/contacts", package = "phone-backup-contacts", version = "0.5.0" }
image-engine = { path = "libs/media/image", package = "phone-backup-image", version = "0.5.0" }
messages = { path = "libs/data/messages", package = "phone-backup-messages", version = "0.5.0" }
apps = { path = "libs/data/apps", package = "phone-backup-apps", version = "0.5.0" }
whatsapp = { path = "libs/apps/whatsapp", package = "phone-backup-whatsapp", version = "0.5.0" }
audio-engine = { path = "libs/media/audio", package = "phone-backup-audio", version = "0.5.0" }
adapter-ios = { path = "libs/adapters/ios", package = "phone-backup-adapter-ios", version = "0.5.0" }
scanner-engine = { path = "libs/scanner", package = "phone-backup-scanner", version = "0.5.0" }
documents = { path = "libs/data/documents", package = "phone-backup-documents", version = "0.5.0" }
video-engine = { path = "libs/media/video", package = "phone-backup-video", version = "0.5.0" }
calls = { path = "libs/data/calls", package = "phone-backup-calls", version = "0.5.0" }
calendar = { path = "libs/data/calendar", package = "phone-backup-calendar", version = "0.5.0" }
telegram = { path = "libs/apps/telegram", package = "phone-backup-telegram", version = "0.5.0" }
notes = { path = "libs/data/notes", package = "phone-backup-notes", version = "0.5.0" }
wifi = { path = "libs/data/wifi", package = "phone-backup-wifi", version = "0.5.0" }
bookmarks = { path = "libs/data/bookmarks", package = "phone-backup-bookmarks", version = "0.5.0" }


