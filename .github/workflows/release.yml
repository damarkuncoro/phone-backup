name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: phone-backup-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: phone-backup-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: phone-backup-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --bin phone-backup --target ${{ matrix.target }}

      - name: Package Assets
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/phone-backup dist/${{ matrix.asset_name }}
          cd dist && zip ../${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
