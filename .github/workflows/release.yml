name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: phone-backup-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: phone-backup-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: phone-backup-macos-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: phone-backup.exe

    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p phone-backup
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/phone-backup${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  build-gui:
    name: Build GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'

    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnm-dev libsoup2.4-dev curl wget libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend dependencies
        run: |
          cd apps/gui/ui
          npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # this will be replaced by tauri-action
          releaseName: 'Phone Backup v__VERSION__'
          releaseBody: 'See the assets below for the pre-compiled binaries.'
          releaseDraft: true
          prerelease: false
          projectPath: apps/gui
